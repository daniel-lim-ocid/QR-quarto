name: Render and Deploy Quarto Project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Renders the project from the root folder
      - name: Render Quarto Project
        run: quarto render --to html

      # Points directly to the root-level output directory
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book/html   # Update if your output-dir in _quarto.yml is different (e.g., _site or _book)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4